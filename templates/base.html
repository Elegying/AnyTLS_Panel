<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e131d">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <title>{% block title %}AnyTLS Panel{% endblock %}</title>
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="mobile-header">
        <button class="icon-button" type="button" data-action="toggle-sidebar" aria-label="打开导航菜单" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="mobile-brand"><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i><span>AnyTLS Panel</span></div>
        <span class="icon-button" aria-hidden="true" style="visibility:hidden"></span>
    </header>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="toggle-sidebar" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand">
            <span class="brand-mark"><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i></span>
            <div class="brand-copy">
                <div class="brand-title">AnyTLS Panel</div>
                <div class="brand-subtitle">节点统一管理面板</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard' }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>
                <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>仪表盘</span>
            </a>
            <a href="{{ url_for('accounts_list') }}" class="nav-link {{ 'active' if request.endpoint in ['accounts_list', 'account_detail'] }}" {% if request.endpoint in ['accounts_list', 'account_detail'] %}aria-current="page"{% endif %}>
                <i class="bi bi-people" aria-hidden="true"></i><span>账号</span>
            </a>
            <a href="{{ url_for('nodes_monitor') }}" class="nav-link {{ 'active' if request.endpoint == 'nodes_monitor' }}" {% if request.endpoint == 'nodes_monitor' %}aria-current="page"{% endif %}>
                <i class="bi bi-activity" aria-hidden="true"></i><span>监控</span>
            </a>
            <a href="{{ url_for('rename_rules_page') }}" class="nav-link {{ 'active' if request.endpoint == 'rename_rules_page' }}" {% if request.endpoint == 'rename_rules_page' %}aria-current="page"{% endif %}>
                <i class="bi bi-signpost-split" aria-hidden="true"></i><span>重命名规则</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-action" type="button" data-action="open-modal" data-modal="pwModal">
                <i class="bi bi-key" aria-hidden="true"></i><span>修改密码</span>
            </button>
            <form method="POST" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="sidebar-action">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>退出登录</span>
                </button>
            </form>
        </div>
    </aside>

    <main class="main" id="main-content" tabindex="-1">
        <div class="content-shell">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}" role="status">
                <i class="bi {{ 'bi-check-circle' if category == 'success' else 'bi-exclamation-circle' }}" aria-hidden="true"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <div class="modal-overlay" id="pwModal" aria-hidden="true">
        <section class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="pwModalTitle"><i class="bi bi-shield-lock" aria-hidden="true"></i>修改密码</h2>
                    <p class="modal-description">更新当前管理员的登录凭据。</p>
                </div>
                <button type="button" class="icon-button modal-close" data-action="close-modal" data-modal="pwModal" aria-label="关闭修改密码弹窗"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="{{ url_for('change_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="old-password">原密码</label>
                        <input id="old-password" type="password" name="old_password" autocomplete="current-password" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">新密码</label>
                        <input id="new-password" type="password" name="new_password" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">确认新密码</label>
                        <input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" required>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-ghost" data-action="close-modal" data-modal="pwModal">取消</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check2" aria-hidden="true"></i>保存密码</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script nonce="{{ g.csp_nonce }}">
        const CSRF_TOKEN = "{{ csrf_token() }}";
        let lastFocusedElement = null;

        function csrfHeaders(extra) {
            return Object.assign({'X-CSRFToken': CSRF_TOKEN}, extra || {});
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggle = document.querySelector('.mobile-header [data-action="toggle-sidebar"]');
            const isOpen = sidebar.classList.toggle('open');
            overlay.classList.toggle('show', isOpen);
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            lastFocusedElement = document.activeElement;
            modal.classList.add('show');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            const first = modal.querySelector('input:not([type="hidden"]), textarea, select, button');
            if (first) window.setTimeout(() => first.focus(), 0);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        function showToast(message, success) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.setAttribute('role', 'status');
            const icon = document.createElement('i');
            icon.className = 'bi ' + (success ? 'bi-check-circle' : 'bi-exclamation-circle');
            icon.style.color = success ? 'var(--green)' : 'var(--red)';
            const text = document.createElement('span');
            text.textContent = message;
            toast.append(icon, text);
            document.body.appendChild(toast);
            window.setTimeout(() => toast.remove(), 1800);
        }

        function copyText(text) {
            const fallbackCopy = () => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
                document.body.appendChild(textarea);
                textarea.select();
                const copied = document.execCommand('copy');
                textarea.remove();
                return copied;
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('已复制到剪贴板', true))
                    .catch(() => {
                        const copied = fallbackCopy();
                        showToast(copied ? '已复制到剪贴板' : '复制失败', copied);
                    });
            } else {
                const copied = fallbackCopy();
                showToast(copied ? '已复制到剪贴板' : '复制失败', copied);
            }
        }

        document.querySelectorAll('.sidebar a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            });
        });

        document.addEventListener('click', event => {
            const target = event.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            if (action !== 'navigate') event.preventDefault();
            if (action === 'toggle-sidebar') toggleSidebar();
            else if (action === 'open-modal') openModal(target.dataset.modal);
            else if (action === 'close-modal') closeModal(target.dataset.modal);
            else if (action === 'navigate') location.href = target.dataset.href;
            else if (action === 'sync-all') window.syncAll(target);
            else if (action === 'check-all') window.checkAll();
            else if (action === 'open-share') window.openShareModal();
            else if (action === 'copy-value') copyText(target.dataset.copyValue);
            else if (action === 'copy-input') copyText(document.getElementById(target.dataset.inputId).value);
            else if (action === 'toggle-password') window.togglePw(Number(target.dataset.nodeId), target.dataset.password, target);
            else if (action === 'check-node') window.checkNode(Number(target.dataset.nodeId));
            else if (action === 'share-node') window.shareNode(target);
            else if (action === 'regenerate-token') window.regenerateToken();
            else if (action === 'delete-account' && confirm(target.dataset.confirm)) document.getElementById(target.dataset.formId).submit();
            else if (action === 'check-host') window.checkOne(target.dataset.host, Number(target.dataset.port));
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                const open = document.querySelector('.modal-overlay.show');
                if (open) closeModal(open.id);
                else if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
            }
            if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action="navigate"]')) {
                event.preventDefault();
                location.href = event.target.dataset.href;
            }
        });

        document.addEventListener('submit', event => {
            const message = event.target.dataset.confirm;
            if (message && !confirm(message)) event.preventDefault();
        });

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', event => {
                if (event.target === modal) closeModal(modal.id);
            });
        });
    </script>
</body>
</html>
