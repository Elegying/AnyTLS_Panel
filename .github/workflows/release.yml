name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$(cat VERSION)" ]]
          git fetch origin main --depth=1
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          [[ "$(git rev-parse origin/main)" == "$tag_commit" ]]
          successful_ci_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$tag_commit&event=push&status=success" \
            --jq '.total_count')"
          [[ "$successful_ci_runs" -ge 1 ]]
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
        shell: bash

      - name: Build reproducible source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="AnyTLS_Panel-${RELEASE_TAG}.tar.gz"
          prefix="AnyTLS_Panel-${RELEASE_TAG#v}/"
          git archive --format=tar --prefix="$prefix" "$GITHUB_SHA" | gzip -n > "$archive"
          sha256sum "$archive" > "${archive}.sha256"

          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys

          heading = f"## [{sys.argv[1].removeprefix('v')}]"
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          try:
              start = next(index for index, line in enumerate(lines) if line.startswith(heading)) + 1
          except StopIteration as exc:
              raise SystemExit(f"missing changelog section: {heading}") from exc
          end = next(
              (index for index in range(start, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"empty changelog section: {heading}")
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign source archive with GitHub OIDC
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="AnyTLS_Panel-${RELEASE_TAG}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"

      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="AnyTLS_Panel-${RELEASE_TAG}.tar.gz"
          draft_created=0
          cleanup_draft() {
            if [[ "$draft_created" -eq 1 ]]; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
          }
          trap cleanup_draft EXIT

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "AnyTLS Panel ${RELEASE_TAG}" \
            --notes-file release-notes.md
          draft_created=1
          gh release upload "$RELEASE_TAG" \
            "$archive" \
            "${archive}.sha256" \
            "${archive}.sigstore.json"
          draft_created=0

      - name: Deploy the tagged release to production
        if: ${{ vars.PROD_HOST != '' }}
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ -n "$PROD_HOST" && -n "$PROD_SSH_PRIVATE_KEY" && -n "$PROD_SSH_KNOWN_HOSTS" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/production_key
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/production_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/production_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${PROD_USER:-anytls-deploy}@${PROD_HOST}" \
            "sudo -n /usr/local/sbin/deploy-anytls-panel '$RELEASE_TAG'"

      - name: Verify the public production endpoint
        if: ${{ vars.PROD_HOST != '' }}
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          [[ "$PROD_URL" == https://* ]]
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f -- "$headers" "$body"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 5 --max-time 20 \
            --dump-header "$headers" --output "$body" \
            "${PROD_URL%/}/login"
          grep -Fqi 'strict-transport-security:' "$headers"
          grep -Fqi 'content-security-policy:' "$headers"
          grep -Fq 'AnyTLS' "$body"

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
