name: Bug 报告
description: 报告可以稳定复现的功能、部署或兼容性问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请勿填写此表单，请改用仓库 Security 页面的私密报告入口。
        提交前请删除域名、IP、用户名、密码、Token、订阅 URL 和节点凭据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题
          required: true
        - label: 我已阅读快速开始、常见问题和运维手册
          required: true
        - label: 这不是需要私下报告的安全漏洞
          required: true
        - label: 我已从日志和截图中删除所有敏感信息
          required: true
  - type: input
    id: version
    attributes:
      label: AnyTLS Panel 版本
      description: 填写 Release 标签和提交 SHA，不要只写“最新版”
      placeholder: "v1.3.0 / 提交哈希"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 官方 deploy.sh
        - 从 Release 归档安装
        - 本地开发启动
        - 非官方或修改后的部署
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、服务器架构和浏览器版本
      placeholder: "Ubuntu 24.04, Python 3.12, amd64, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你认为正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？请写出完整错误信息，但先脱敏
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 输入虚构测试数据……
        3. 点击……
        4. 观察到……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 不要上传数据库、密钥文件、订阅内容或完整环境变量
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 是否能稳定复现、最近做过什么修改、有哪些临时解决办法？
