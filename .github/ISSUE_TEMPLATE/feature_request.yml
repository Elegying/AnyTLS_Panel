name: 功能请求
description: 提议一个明确、可验证的产品或运维改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议
          required: true
        - label: 这个请求与 AnyTLS Panel 的订阅、节点、流量或运维范围直接相关
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的问题
      description: 先描述使用场景和困难，不要只写想要的按钮或技术方案
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 完成后用户可以更容易地做什么？如何判断功能有效？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以包含界面、API、配置或兼容性想法
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 当前如何绕过，为什么不够好？
  - type: checkboxes
    id: impact
    attributes:
      label: 影响范围
      options:
        - label: 数据库或迁移
        - label: 部署、systemd 或 Caddy
        - label: 安全边界或敏感数据
        - label: API 向后兼容
        - label: 用户界面或无障碍
        - label: 文档
